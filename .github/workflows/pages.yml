name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # tf#384：GitHub 托管 runner 2026-08-31 起被 Actions 预算卡死(job 不启动)，改走自家 CodeBuild runner(org 级 webhook，optima-terraform stacks/shared/073-codebuild-github-runner.tf)。
    runs-on: codebuild-optima-runner-x86-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
